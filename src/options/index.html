<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS斬り 設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>JS斬り</h1>

      <section aria-labelledby="cut-sites-heading">
        <h2 id="cut-sites-heading">JavaScriptを斬っているサイト</h2>
        <p id="empty-message" hidden>現在、対象サイトはありません。</p>
        <ul id="site-list"></ul>
      </section>

      <section aria-labelledby="blocking-heading">
        <h2 id="blocking-heading">簡易通信ブロック</h2>
        <dl>
          <div><dt>状態</dt><dd>有効</dd></div>
          <div><dt>登録ルール</dt><dd id="rule-count">—</dd></div>
        </dl>
      </section>

      <section aria-labelledby="privacy-heading">
        <h2 id="privacy-heading">Privacy</h2>
        <ul class="plain-list">
          <li>外部通信なし</li>
          <li>Telemetryなし</li>
          <li>Analyticsなし</li>
          <li>ページ本文を読み取らない</li>
          <li>閲覧履歴を収集しない</li>
        </ul>
      </section>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
